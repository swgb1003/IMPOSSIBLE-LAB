<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン | IMPOSSIBLE LIBRARY</title>
<meta name="description" content="開発者と運営のログイン">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Oxanium:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/site/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site/site.css">
</head>
<body class="work auth" data-page="login">
<header class="bar">
  <a class="mark" href="/" aria-label="IMPOSSIBLE LIBRARY の入口へ">
    <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11.5" fill="none" stroke="#ff6a26" stroke-width="2.5"/><path d="M14 8.5 19.5 14 14 19.5 8.5 14Z" fill="#2fe3e6"/></svg>
    <b>IMPOSSIBLE LIBRARY</b>
  </a>
  <div class="bar-r">
    <nav aria-label="サイト">
      <a href="/inventions">発明品一覧</a>
      <a href="/terms">利用規約</a>
    </nav>
    <div class="acct" data-slot="acct"></div>
  </div>
</header>

<main>
  <section class="board" aria-labelledby="page-h">
    <div class="t span6c form-plate">
      <h1 id="page-h">ログイン</h1>
      <p class="lead-s" data-slot="why" hidden>続けるには、ログインしてください。</p>
      <form class="form" data-slot="form" novalidate>
        <label class="field"><span>メールアドレス</span><input name="email" type="email" autocomplete="email" maxlength="254" required></label>
        <label class="field"><span>パスワード</span><input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
        <p class="err" role="alert" data-slot="err"></p>
        <div class="acts"><button class="btn p sm" type="submit">ログインする</button><a class="txt" href="/forgot">パスワードを忘れたとき</a></div>
      </form>
      <div class="alt-ways">
        <p>開発者で、まだ登録していないとき<a href="/signup">新規登録</a></p>
        <p>発案者は、Quest に出る番号で入れます<a href="/pair">Quest の番号で入る</a></p>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/site/auth.js"></script>
</body>
</html>
